<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>날씨</title>
<!-- 앱 설치(PWA) · 안드로이드 상태 표시줄 색 -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#2f6fed" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0f1318" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" type="image/png" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1d2433; --muted: #6b7486;
    --line: #e3e7ef; --accent: #2f6fed; --hot: #e2553d; --cold: #2f6fed;
    --sea: #eaf1fa; --land: #fbfcfe; --land-hover: #eef2f8; --land-line: #b9c3d3; --border-heat: #3b4352;
    --shade: #cdd3dc; --mdl: #d63a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1318; --card: #1b2129; --text: #eef1f6; --muted: #a7b0c0;
            --line: #313b49; --accent: #7aa7ff; --hot: #ff8a75; --cold: #82adff;
            --sea: #0d1520; --land: #252e3b; --land-hover: #2f3a49; --land-line: #4d5a70; --border-heat: #0b0f15;
            --shade: #2c3440; --mdl: #ff7b7b; }
    /* 어두운 화면에서 눈부시지 않게: 기온 색·점·나라 색을 살짝 낮춤 */
    #heat { opacity: .78; }
    .country { fill-opacity: .82; }
    .dot { opacity: .85; }
    .mk rect { fill: #1f2630; }
    .tabs button.on, .seg button.on, .ovl .tool.on { color: #0b1220; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
         -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
  button, input { touch-action: manipulation; } /* 두 번 탭 확대 지연 없앰 */
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px 16px 32px; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  .ext { display: flex; gap: 8px; margin-right: auto; flex-wrap: wrap; }
  .ext button { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--line); background: var(--card);
                color: var(--text); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .ext button:hover { border-color: var(--accent); }
  .ext .k { color: var(--muted); font-size: 12px; }
  .ext b { font-size: 15px; }
  .search { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px;
            padding: 7px 10px; font: inherit; font-size: 14px; width: 200px; }
  .search.miss { border-color: var(--hot); }
  .updated { color: var(--muted); font-size: 13px; }
  button.btn { border: 1px solid var(--line); background: var(--card); color: var(--text);
               border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 12px 0 10px; }
  .tabs button { border: 0; background: var(--card); color: var(--muted); padding: 7px 16px; font: inherit; font-size: 14px; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: #fff; }
  .tabbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .subtabs { display: inline-flex; gap: 2px; }
  .subtabs button { border: 0; background: none; color: var(--muted); padding: 6px 10px; font: inherit; font-size: 13px;
                    cursor: pointer; border-bottom: 2px solid transparent; }
  .subtabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
  @media (max-width: 960px) { .main { grid-template-columns: 1fr; } }

  /* 지도 */
  .mapbox { position: relative; background: var(--sea); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .mapbox svg { display: block; width: 100%; height: calc(100vh - 150px); min-height: 460px; user-select: none; }
  .prov { fill: var(--land); stroke: var(--land-line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round;
          cursor: pointer; }
  #shade, #shadeN { fill: var(--shade); stroke: none; pointer-events: none; }
  .prov.off { display: none; }
  #mdl { fill: none; stroke: var(--mdl); stroke-width: 2.4; stroke-dasharray: 8 4; stroke-linejoin: round;
         vector-effect: non-scaling-stroke; pointer-events: none; }
  .mdl-label { font-weight: 700; fill: var(--mdl); paint-order: stroke; stroke: var(--sea); pointer-events: none; }
  .prov:hover { fill: var(--land-hover); }
  .prov.dim { opacity: .45; }
  .prov.sel { stroke: var(--accent); stroke-width: 1.8; cursor: default; }
  /* 기온 분포: 아래 깔린 기온 이미지가 보이도록 육지를 투명하게, 경계선은 진하게 */
  .heat .prov { fill: transparent; stroke: var(--border-heat); stroke-width: .8; }
  .heat .prov:hover { fill: rgba(255, 255, 255, .18); }
  .heat .prov.dim { opacity: 1; fill: var(--sea); fill-opacity: .72; }
  .heat .prov.sel { stroke: var(--accent); stroke-width: 2; }
  #heat { pointer-events: none; }
  .mk { cursor: pointer; }
  .mk rect { fill: var(--card); stroke-width: 2; }
  .mk.active rect { stroke: var(--accent) !important; stroke-width: 3; }
  /* 지도 위 글자는 나눔고딕 */
  #map text, #globe text { font-family: "Nanum Gothic", "NanumGothic", "Malgun Gothic", sans-serif; }
  .mk text { fill: var(--text); }
  .mk .nm { font-size: 11px; fill: var(--text); paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; }
  .heat .mk .nm { stroke: var(--card); }
  .dot { cursor: pointer; stroke: var(--card); stroke-width: 1.5; }
  .leader { stroke: var(--muted); stroke-width: 1; }

  .ovl { position: absolute; display: flex; align-items: center; gap: 6px; background: var(--card);
         border: 1px solid var(--line); border-radius: 8px; padding: 4px; font-size: 13px; }
  .crumb { left: 10px; top: 10px; }
  .crumb .title { font-weight: 600; padding: 0 6px; }
  .seg { display: inline-flex; border-radius: 6px; overflow: hidden; }
  .seg button, .ovl .tool { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px;
                            padding: 4px 10px; cursor: pointer; border-radius: 6px; }
  .seg button.on, .ovl .tool.on { background: var(--accent); color: #fff; }
  .crumb .back { color: var(--accent); }
  .tools { right: 10px; top: 10px; }
  .legend { left: 10px; bottom: 10px; padding: 5px 9px; color: var(--muted); font-size: 12px; }
  .legend .scale { height: 8px; width: 150px; border-radius: 2px; }

  /* 세계 지구본 */
  .worldbox { background: var(--card); }
  #globe { display: block; width: 100%; height: calc(100vh - 150px); min-height: 460px; cursor: grab; touch-action: none; user-select: none; }
  #globe.dragging { cursor: grabbing; }
  .sphere { fill: var(--sea); stroke: var(--land-line); stroke-width: 1; }
  .grat { fill: none; stroke: var(--land-line); stroke-opacity: .4; stroke-width: .5; }
  .country { stroke: var(--card); stroke-width: .6; cursor: pointer; }
  .country:hover { stroke: var(--text); stroke-width: 1.2; }
  .country.sel { stroke: var(--accent); stroke-width: 2.2; }
  .cname { fill: var(--text); font-weight: 800; text-anchor: middle; dominant-baseline: middle;
           pointer-events: none; letter-spacing: .02em; }
  .wmsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }

  /* 목록: 시·도별 한 줄 요약 + 펼치면 도시 칩 */
  .listview { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 16px 14px; }
  .lhead, .prow { display: grid; grid-template-columns: minmax(110px, 1fr) 32px 60px 120px 70px; align-items: center; gap: 8px; }
  .lhead { color: var(--muted); font-size: 12px; padding: 6px 6px; }
  .lhead span:nth-child(3), .lhead span:nth-child(4) { text-align: right; }
  .prow { width: 100%; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; font: inherit;
          font-size: 15px; padding: 10px 6px; cursor: pointer; text-align: left; }
  .prow:hover { background: var(--bg); }
  .prow .pn { font-weight: 600; }
  .prow .pt { text-align: right; font-weight: 700; font-size: 17px; }
  .prow .pr { text-align: right; font-size: 13px; }
  .prow .pc { text-align: right; color: var(--muted); font-size: 12px; }
  .prow .chev { display: inline-block; transition: transform .15s; }
  .prow.open .chev { transform: rotate(90deg); }
  .pcities { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 6px 12px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--bg);
          color: inherit; font: inherit; font-size: 13px; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .chip:hover, .chip.active { border-color: var(--accent); }
  .lsep { border-top: 2px solid var(--line); margin-top: 10px; padding: 10px 6px 4px; font-weight: 700; font-size: 13px; color: var(--muted); }
  @media (max-width: 520px) {
    .lhead, .prow { grid-template-columns: 1fr 26px 48px 92px; }
    .lhead span:last-child, .prow .pc { display: none; }
  }
  .hi { color: var(--hot); } .lo { color: var(--cold); }

  /* 상세 */
  .detail { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; position: sticky; top: 12px; }
  .detail h2 { margin: 0; font-size: 22px; }
  .detail .flag { position: absolute; top: 16px; right: 16px; width: 60px; height: 45px; object-fit: cover;
                  border-radius: 4px; border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
  .detail .flag ~ .dtitle { padding-right: 72px; }
  .detail .prov-name { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .now { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
  .now .big { font-size: 46px; font-weight: 700; }
  .now .icon { font-size: 48px; }
  .now .desc { color: var(--muted); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
  .stat .k { color: var(--muted); font-size: 12px; } .stat .v { font-weight: 600; margin-top: 2px; font-size: 14px; }
  h3 { font-size: 14px; margin: 16px 0 8px; }
  .hourly { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .hour { flex: 0 0 56px; text-align: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; font-size: 12px; }
  .hour .i { font-size: 20px; margin: 3px 0; }
  .hour .p { color: var(--accent); font-size: 11px; }
  .day { display: grid; grid-template-columns: 70px 26px 1fr 40px 32px 32px; align-items: center; gap: 6px;
         border-bottom: 1px solid var(--line); padding: 6px 0; font-size: 13px; }
  .day:last-child { border-bottom: 0; }
  .day .bar { height: 6px; border-radius: 3px; background: var(--line); position: relative; }
  .day .bar span { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--cold), var(--hot)); }
  .day .p { color: var(--accent); font-size: 11px; text-align: right; }
  .day .hi, .day .lo { text-align: right; }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: var(--hot); margin: 8px 0; }
  footer { color: var(--muted); font-size: 12px; margin-top: 16px; }
  footer a { color: inherit; }
  .grab { display: none; }
  #searchBtn, .br, .dnow { display: none; }
  .tabbar { flex-basis: 100%; }
  .install { display: none; }
  .install.show { display: inline-block; background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ───────── 휴대폰(안드로이드) ───────── */
  @media (max-width: 760px) {
    /* --headH: 머리 높이(스크립트가 실제 높이로 채움), --peek: 접힌 상세 시트 높이 */
    :root { --peek: 76px; --headH: 96px; }
    .wrap { padding: env(safe-area-inset-top) 0 calc(var(--peek) + 12px + env(safe-area-inset-bottom)); }

    /* 머리 1줄: 제목 · [한국|세계] · 검색 · 새로고침 / 2줄: 지도·목록 · 최고·최저(가로 스크롤) */
    header { position: sticky; top: 0; z-index: 40; background: var(--bg); gap: 6px 8px; padding: 8px 10px 6px; }
    h1 { font-size: 19px; order: 1; }
    .tabbar { display: contents; }
    .tabs { order: 2; margin: 0 auto 0 4px; }
    .tabs button { padding: 7px 16px; font-size: 14px; }
    .updated { display: none; }
    .install { order: 3; }
    #searchBtn { display: inline-block; order: 4; }
    #refresh { order: 5; }
    button.btn { padding: 7px 11px; font-size: 14px; border-radius: 10px; }
    .br { display: block; order: 6; flex-basis: 100%; height: 0; }
    .search { order: 7; width: 100%; font-size: 16px; padding: 9px 12px; border-radius: 10px; display: none; } /* 16px: 입력 시 화면 확대 방지 */
    header.searching .search { display: block; }
    .subtabs { order: 8; }
    .subtabs button { padding: 5px 9px; font-size: 13px; }
    .ext { order: 9; flex: 1; min-width: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0; gap: 6px; }
    .ext::-webkit-scrollbar { display: none; }
    .ext button { flex: 0 0 auto; padding: 4px 10px; font-size: 12px; }
    .ext .k { font-size: 11px; } .ext b { font-size: 13px; }

    /* 지도: 화면 대부분을 차지, 가장자리까지 */
    .main { display: block; }
    .mapbox { border-radius: 0; border-left: 0; border-right: 0; }
    .mapbox svg, #globe { height: calc(100dvh - var(--headH) - var(--peek) - env(safe-area-inset-top) - env(safe-area-inset-bottom));
                          min-height: 360px; }
    .ovl { padding: 3px; font-size: 12px; }
    .ovl .tool, .seg button { padding: 5px 9px; font-size: 13px; }
    .crumb { left: 8px; top: 8px; } .tools { right: 8px; top: 8px; }
    .legend { left: auto; right: 8px; bottom: 8px; padding: 3px 7px; font-size: 11px; } /* 제주도를 가리지 않게 오른쪽 아래(바다) */
    .legend .scale { width: 64px; height: 6px; }
    .listview { border-radius: 0; border-left: 0; border-right: 0; }
    footer { font-size: 11px; padding: 0 10px; }
    .err { padding: 0 10px; }

    /* 상세 날씨: 화면 아래 바텀시트. 접힌 상태는 '도시 · 날씨 · 기온' 한 줄, 누르거나 위로 쓸면 펼침 */
    .detail { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 50; margin: 0;
              border-radius: 16px 16px 0 0; border-bottom: 0; max-height: 84dvh; overflow: hidden;
              padding: 4px 16px calc(16px + env(safe-area-inset-bottom));
              transform: translateY(calc(100% - var(--peek) - env(safe-area-inset-bottom)));
              transition: transform .26s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 -4px 18px rgba(0, 0, 0, .22); }
    .detail.open { transform: translateY(0); overflow-y: auto; overscroll-behavior: contain; }
    .grab { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--muted); opacity: .5; margin: 4px auto 8px; }
    .dhead { display: flex; align-items: center; gap: 10px; min-height: 48px; }
    .dhead .dtitle { flex: 1; min-width: 0; }
    .dhead h2 { font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dhead .prov-name { font-size: 12px; margin: 0; }
    .dnow { display: flex; align-items: center; gap: 4px; font-size: 26px; font-weight: 700; }
    .dnow .ic { font-size: 24px; }
    .detail .flag { position: static; width: 32px; height: 24px; flex: 0 0 auto; border-radius: 3px; }
    .detail .flag ~ .dtitle { padding-right: 0; }
    .detail .now { margin: 10px 0 12px; }
    .now .big { font-size: 38px; } .now .icon { font-size: 38px; }
    .hour { flex-basis: 56px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header id="top">
    <h1>날씨</h1>
    <div class="ext" id="ext"></div>
    <input class="search" id="search" type="search" enterkeyhint="search" placeholder="도시 검색 후 Enter" autocomplete="off" />
    <span class="updated" id="updated">불러오는 중…</span>
    <button class="btn install" id="installBtn" title="홈 화면에 앱으로 설치">앱 설치</button>
    <button class="btn icon-only" id="searchBtn" title="검색" aria-label="검색">🔍</button>
    <button class="btn icon-only" id="refresh" title="새로고침" aria-label="새로고침">⟳</button>
    <i class="br"></i>
    <div class="tabbar">
      <div class="tabs" role="tablist">
        <button id="tabKorea" class="on" role="tab">한국</button>
        <button id="tabWorld" role="tab">세계</button>
      </div>
      <!-- 한국 탭에 딸린 보기 -->
      <div class="subtabs" id="subTabs">
        <button id="tabMap" class="on">지도</button>
        <button id="tabList">목록</button>
      </div>
    </div>
  </header>
  <div id="error" class="err" hidden></div>

  <div class="main">
    <div>
      <div class="mapbox" id="mapView">
        <svg id="map" role="img" aria-label="전국 도시별 날씨 지도">
          <defs>
            <clipPath id="southClip"><path id="southClipPath"/></clipPath>
            <clipPath id="northClip"><path id="northClipPath"/></clipPath>
          </defs>
          <image id="heat" preserveAspectRatio="none" hidden></image>
          <g id="land"></g>
          <g id="southDeco" hidden>
            <path id="shadeN"/>
            <path id="shade" clip-path="url(#northClip)"/>
            <path id="mdl"/>
            <text id="mdlLabel" class="mdl-label">휴전선</text>
          </g>
          <g id="marks"></g>
        </svg>
        <div class="ovl crumb" id="crumb">
          <div class="seg" id="seg">
            <button data-top="all" class="on">한반도</button>
            <button data-top="south">남한</button>
          </div>
          <button class="tool back" id="back" hidden>← 돌아가기</button>
          <span class="title" id="crumbText" hidden></span>
        </div>
        <div class="ovl tools" id="tools">
          <button class="tool" id="heatBtn" title="기온 분포를 색으로 보기">🌡 기온 분포</button>
        </div>
        <div class="ovl legend"><span>−15°</span><span class="scale" id="legendScale"></span><span>35°</span></div>
      </div>
      <div class="listview" id="listView" hidden></div>
      <div class="mapbox worldbox" id="worldView" hidden>
        <svg id="globe" role="img" aria-label="세계 나라별 날씨 지구본"></svg>
        <div class="ovl crumb"><span class="title">세계 · 도시별 날씨</span></div>
        <div class="ovl tools">
          <button class="tool" id="gzin" title="확대">＋</button>
          <button class="tool" id="gzout" title="축소">－</button>
          <button class="tool" id="gzreset" title="원래 크기">1×</button>
          <button class="tool on" id="spinBtn" title="지구본 자동 회전">⟳ 자동 회전</button>
        </div>
        <div class="ovl legend"><span>−15°</span><span class="scale"></span><span>35°</span></div>
        <div class="wmsg" id="worldMsg" hidden>지구본을 불러오는 중…</div>
      </div>
    </div>
    <aside class="detail" id="sheet">
      <div class="grab" id="grab" role="button" aria-label="상세 날씨 펼치기/접기"></div>
      <div id="detail"><div class="muted">도시를 선택하세요.</div></div>
    </aside>
  </div>

  <footer>날씨 데이터: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0) ·

<script src="cities.js"></script>

<script src="world_cities.js"></script>
<script>
// ───────── 데이터 ─────────
const PROV = Object.fromEntries(window.PROVINCES.map(p => [p.key, p]));
function inRing([x, y], ring) {
  let inside = false;
  for (let a = 0, b = ring.length - 1; a < ring.length; b = a++) {
    const [xa, ya] = ring[a], [xb, yb] = ring[b];
    if ((ya > y) !== (yb > y) && x < (xb - xa) * (y - ya) / (yb - ya) + xa) inside = !inside;
  }
  return inside;
}
// 휴전선(군사분계선)과 남북 경계: mdl.js (OpenStreetMap 자료로 생성)
const MDL = window.MDL_LINE;
// 남·북 구분: 서해 북방한계선 서쪽 끝(백령도 북쪽, 개략) → OSM 경계선 → 동해로 연장
const BORDER = window.BORDER_LINE;
const DIVIDE = [[118, 38.05], [124.85, 38.03], [125.10, 37.80], [125.55, 37.74], ...BORDER, [136, BORDER[BORDER.length - 1][1]]];
const SOUTH_POLY = [...DIVIDE, [136, 30], [118, 30]];
const NORTH_POLY = [...DIVIDE, [136, 46], [118, 46]];
// 휴전선이 지나가 남·북으로 잘라야 하는 도 (나머지는 도 단위로 남/북이 정해짐)
const SPLIT = ["경기", "강원"];
const CITIES = window.CITIES.map(([name, lat, lon, prov, rank], i) => ({
  id: i, name, lat, lon, prov, rank, north: !!PROV[prov].north,
  // 휴전선 이남 여부: 휴전선이 지나는 경기·강원만 선으로 판별 (개성·평강 등 미수복 지역 제외)
  south: !PROV[prov].north && (!SPLIT.includes(prov) || inRing([lon, lat], SOUTH_POLY)),
}));
const GEO = window.KOREA_GEO || { features: [] };
const METRO = ["서울", "부산", "대구", "인천", "대전", "울산", "세종"];

// WMO 날씨 코드 → [설명, 낮 아이콘, 밤 아이콘]
const WMO = {
  0: ["맑음", "☀️", "🌙"], 1: ["대체로 맑음", "🌤️", "🌙"], 2: ["구름 조금", "⛅", "☁️"], 3: ["흐림", "☁️", "☁️"],
  45: ["안개", "🌫️", "🌫️"], 48: ["짙은 안개", "🌫️", "🌫️"],
  51: ["약한 이슬비", "🌦️", "🌧️"], 53: ["이슬비", "🌦️", "🌧️"], 55: ["강한 이슬비", "🌧️", "🌧️"],
  56: ["어는 이슬비", "🌧️", "🌧️"], 57: ["강한 어는 이슬비", "🌧️", "🌧️"],
  61: ["약한 비", "🌦️", "🌧️"], 63: ["비", "🌧️", "🌧️"], 65: ["강한 비", "🌧️", "🌧️"],
  66: ["어는 비", "🌧️", "🌧️"], 67: ["강한 어는 비", "🌧️", "🌧️"],
  71: ["약한 눈", "🌨️", "🌨️"], 73: ["눈", "🌨️", "🌨️"], 75: ["폭설", "❄️", "❄️"], 77: ["싸락눈", "🌨️", "🌨️"],
  80: ["약한 소나기", "🌦️", "🌧️"], 81: ["소나기", "🌧️", "🌧️"], 82: ["강한 소나기", "⛈️", "⛈️"],
  85: ["약한 눈 소나기", "🌨️", "🌨️"], 86: ["강한 눈 소나기", "❄️", "❄️"],
  95: ["뇌우", "⛈️", "⛈️"], 96: ["우박 동반 뇌우", "⛈️", "⛈️"], 99: ["강한 우박 뇌우", "⛈️", "⛈️"],
};
const wmo = (code, isDay = 1) => { const w = WMO[code] || ["알 수 없음", "❔", "❔"]; return { desc: w[0], icon: isDay ? w[1] : w[2] }; };
const WIND_DIRS = ["북", "북북동", "북동", "동북동", "동", "동남동", "남동", "남남동", "남", "남남서", "남서", "서남서", "서", "서북서", "북서", "북북서"];
const windDir = deg => WIND_DIRS[Math.round(deg / 22.5) % 16] + "풍";
const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
const r = n => Math.round(n);

// 기온 색: −15°C 파랑 … 35°C 빨강. 기온 분포 지도는 2°C 단위 계단색
const T_MIN = -15, T_MAX = 35, BAND = 2;
const hue = t => 225 - Math.max(0, Math.min(1, (t - T_MIN) / (T_MAX - T_MIN))) * 225;
const tempColor = t => `hsl(${Math.round(hue(t))} 72% 50%)`;
const bandOf = t => Math.floor(t / BAND) * BAND + BAND / 2;
function hslRgb(h, s, l) {
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return [f(0) * 255, f(8) * 255, f(4) * 255].map(Math.round);
}
const heatRgb = t => hslRgb(hue(bandOf(t)), .7, .6);

// ───────── 날씨 API ─────────
// 도시가 많아 Open-Meteo 무료 한도(하루 1만 건)를 고려: 전체 현황은 가볍게, 상세는 선택한 도시만
const API = "https://api.open-meteo.com/v1/forecast";
const OVERVIEW_TTL = 30 * 60 * 1000, DETAIL_TTL = 30 * 60 * 1000, CHUNK = 100;
let overview = [];            // CITIES 순서: {temp, code, isDay, max, min}
let overviewTime = 0;
const detailCache = new Map();
let selected = CITIES.findIndex(c => c.name === "서울");

function cacheGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function cacheSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const cityKey = CITIES.map(c => c.name).join();

// Open-Meteo 무료판은 분당 600건(지점 수 기준) 제한 → 최근 1분 사용량을 세어 넘을 것 같으면 기다렸다가 요청
const callLog = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function throttle(n) {
  for (;;) {
    const now = Date.now();
    while (callLog.length && now - callLog[0][0] > 61000) callLog.shift();
    const used = callLog.reduce((s, c) => s + c[1], 0);
    if (used + n <= 550 || !callLog.length) { callLog.push([now, n]); return; }
    await sleep(61000 - (now - callLog[0][0]) + 200);
  }
}
async function apiGet(params, n = 1) {
  await throttle(n);
  const res = await fetch(`${API}?${params}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadOverview(force = false) {
  const $updated = document.getElementById("updated"), $err = document.getElementById("error");
  const cached = cacheGet("kw_overview_v3");
  if (!force && cached && cached.key === cityKey && Date.now() - cached.t < OVERVIEW_TTL) {
    overview = cached.data; overviewTime = cached.t;
  } else {
    $updated.textContent = "불러오는 중…";
    try {
      const chunks = [];
      for (let i = 0; i < CITIES.length; i += CHUNK) chunks.push(CITIES.slice(i, i + CHUNK));
      const results = await Promise.all(chunks.map(async list => {
        const params = new URLSearchParams({
          latitude: list.map(c => c.lat).join(","), longitude: list.map(c => c.lon).join(","),
          current: "temperature_2m,weather_code,is_day",
          daily: "temperature_2m_max,temperature_2m_min",
          timezone: "Asia/Seoul", forecast_days: "1",
        });
        const json = await apiGet(params, list.length);
        return Array.isArray(json) ? json : [json];
      }));
      overview = results.flat().map(d => ({
        temp: d.current.temperature_2m, code: d.current.weather_code, isDay: d.current.is_day,
        max: d.daily.temperature_2m_max[0], min: d.daily.temperature_2m_min[0],
      }));
      overviewTime = Date.now();
      cacheSet("kw_overview_v3", { t: overviewTime, key: cityKey, data: overview });
      $err.hidden = true;
    } catch (e) {
      $err.textContent = "날씨 정보를 불러오지 못했습니다: " + e.message;
      $err.hidden = false;
      $updated.textContent = "";
      return;
    }
  }
  $updated.textContent = "업데이트 " + new Date(overviewTime).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  renderExtremes();
  drawMarkers();
  renderList();
}

// 상단: 현재 보기(한반도/남한) 범위의 최고·최저 기온 지역
function renderExtremes() {
  const el = document.getElementById("ext");
  if (tab === "world") return renderWorldExtremes(el);
  if (!overview.length) { el.innerHTML = ""; return; }
  const scope = topView === "south" ? CITIES.filter(c => c.south) : CITIES;
  let hi = scope[0], lo = scope[0];
  for (const c of scope) {
    if (overview[c.id].temp > overview[hi.id].temp) hi = c;
    if (overview[c.id].temp < overview[lo.id].temp) lo = c;
  }
  const where = topView === "south" ? "남한" : "한반도";
  const chip = (c, label, cls) => `<button data-id="${c.id}" title="${PROV[c.prov].name} ${c.name}">
    <span class="k">${where} ${label}</span><span>${c.name}</span><b class="${cls}">${r(overview[c.id].temp)}°</b></button>`;
  el.innerHTML = chip(hi, "최고", "hi") + chip(lo, "최저", "lo");
  el.querySelectorAll("button").forEach(b => b.onclick = () => select(+b.dataset.id, { focus: true }));
}

// 상세 예보: loc = { key, name, sub, lat, lon, tz } — 국내 도시와 세계 나라 모두 같은 화면을 씀
async function loadDetail(loc) {
  const hit = detailCache.get(loc.key);
  if (hit && Date.now() - hit.t < DETAIL_TTL) return hit.data;
  const params = new URLSearchParams({
    latitude: loc.lat, longitude: loc.lon,
    current: "temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day",
    hourly: "temperature_2m,weather_code,precipitation_probability,is_day",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max",
    timezone: loc.tz || "Asia/Seoul", forecast_days: "7", wind_speed_unit: "ms",
  });
  const data = await apiGet(params, 1);
  detailCache.set(loc.key, { t: Date.now(), data });
  return data;
}
// 세계 모드: 상세 창 오른쪽 위 국기 (불러오지 못하면 숨김)
const flagHtml = loc => loc.flag
  ? `<img class="flag" src="${FLAG_URL(loc.flag)}" alt="${loc.country || ""} 국기" onerror="this.remove()">` : "";
const cityLoc = c => ({ key: "kr" + c.id, name: c.name, sub: PROV[c.prov].name, lat: c.lat, lon: c.lon, quick: overview[c.id] });

// ───────── 선택 / 상세 ─────────
let detailKey = null;
// 상세 머리: 국기 · 이름/지역 · (휴대폰에서 접혔을 때 보이는) 현재 날씨
const detailHead = (loc, nowHtml = "") =>
  `<div class="dhead">${flagHtml(loc)}<div class="dtitle"><h2>${loc.name}</h2><div class="prov-name">${loc.sub}</div></div>
   <div class="dnow">${nowHtml}</div></div>`;
async function showDetail(loc, retry = 0) {
  detailKey = loc.key;
  const el = document.getElementById("detail");
  // 대략적인 현재 기온은 이미 받은 개요에서 바로 보여 줌
  const o = loc.quick;
  el.innerHTML = detailHead(loc, o ? `<span class="ic">${wmo(o.code, o.isDay).icon}</span>${r(o.temp)}°` : "") +
                 `<div class="muted" style="margin-top:12px">불러오는 중…</div>`;
  try {
    const d = await loadDetail(loc);
    if (detailKey === loc.key) renderDetail(loc, d);
  } catch (e) {
    if (detailKey !== loc.key) return;
    if (/429/.test(e.message) && retry < 3) {
      // 요청 한도 초과: 잠시 기다렸다가 자동으로 다시 시도
      el.querySelector(".muted").textContent = "날씨 서버가 잠시 바빠 20초 뒤 다시 불러옵니다…";
      setTimeout(() => { if (detailKey === loc.key) showDetail(loc, retry + 1); }, 20000);
      return;
    }
    el.querySelector(".muted").outerHTML = `<div class="err">상세 예보를 불러오지 못했습니다: ${e.message}</div>`;
  }
}
async function select(id, { focus = false } = {}) {
  selected = id;
  drawMarkers();
  renderList();
  if (focus) focusCity(CITIES[id]);
  showDetail(cityLoc(CITIES[id]));
}

function renderDetail(city, d) {
  const c = d.current, w = wmo(c.weather_code, c.is_day), dl = d.daily;
  const time = s => s.slice(11, 16);
  const nowIdx = Math.max(0, d.hourly.time.findIndex(t => t >= c.time.slice(0, 13)));
  const hours = d.hourly.time.slice(nowIdx, nowIdx + 24).map((t, k) => {
    const j = nowIdx + k, hw = wmo(d.hourly.weather_code[j], d.hourly.is_day[j]);
    return `<div class="hour"><div>${k === 0 ? "지금" : t.slice(11, 13) + "시"}</div>
      <div class="i" title="${hw.desc}">${hw.icon}</div><div><b>${r(d.hourly.temperature_2m[j])}°</b></div>
      <div class="p">💧${d.hourly.precipitation_probability[j] ?? 0}%</div></div>`;
  }).join("");
  const weekMin = Math.min(...dl.temperature_2m_min), weekMax = Math.max(...dl.temperature_2m_max);
  const span = Math.max(1, weekMax - weekMin);
  const days = dl.time.map((t, j) => {
    const dw = wmo(dl.weather_code[j]);
    const date = new Date(t + "T00:00:00");
    const label = j === 0 ? "오늘" : `${date.getMonth() + 1}/${date.getDate()} (${DAYS[date.getDay()]})`;
    const left = (dl.temperature_2m_min[j] - weekMin) / span * 100;
    const width = (dl.temperature_2m_max[j] - dl.temperature_2m_min[j]) / span * 100;
    return `<div class="day"><div>${label}</div><div title="${dw.desc}">${dw.icon}</div>
      <div class="bar"><span style="left:${left}%;width:${width}%"></span></div>
      <div class="p">💧${dl.precipitation_probability_max[j] ?? 0}%</div>
      <div class="lo">${r(dl.temperature_2m_min[j])}°</div><div class="hi">${r(dl.temperature_2m_max[j])}°</div></div>`;
  }).join("");
  document.getElementById("detail").innerHTML = `
    ${detailHead(city, `<span class="ic">${w.icon}</span>${r(c.temperature_2m)}°`)}
    <div class="now"><span class="icon">${w.icon}</span>
      <div><div class="big">${r(c.temperature_2m)}°</div><div class="desc">${w.desc} · 체감 ${r(c.apparent_temperature)}°</div></div></div>
    <div class="stats">
      <div class="stat"><div class="k">최고 / 최저</div><div class="v"><span class="hi">${r(dl.temperature_2m_max[0])}°</span> / <span class="lo">${r(dl.temperature_2m_min[0])}°</span></div></div>
      <div class="stat"><div class="k">습도</div><div class="v">${c.relative_humidity_2m}%</div></div>
      <div class="stat"><div class="k">바람</div><div class="v">${windDir(c.wind_direction_10m)} ${c.wind_speed_10m.toFixed(1)}m/s</div></div>
      <div class="stat"><div class="k">강수량</div><div class="v">${c.precipitation}mm</div></div>
      <div class="stat"><div class="k">자외선 최대</div><div class="v">${dl.uv_index_max[0]?.toFixed(1) ?? "-"}</div></div>
      <div class="stat"><div class="k">일출 / 일몰</div><div class="v">${time(dl.sunrise[0])} / ${time(dl.sunset[0])}</div></div>
    </div>
    <h3>시간별 예보</h3><div class="hourly">${hours}</div>
    <h3>7일 예보</h3><div>${days}</div>`;
}

// ───────── 목록: 시·도별 한 줄 요약, 누르면 그 시·도 도시들이 펼쳐짐 ─────────
const openGroups = new Set();
function renderList() {
  const el = document.getElementById("listView");
  if (el.hidden || !overview.length) return;
  const q = document.getElementById("search").value.trim();
  const groups = [{ id: "metro", name: "특별·광역시", keys: METRO },
                  ...window.PROVINCES.filter(p => !METRO.includes(p.key)).map(p => ({ id: p.key, name: p.name, keys: [p.key], north: p.north }))];
  let html = `<div class="lhead"><span>지역</span><span></span><span>평균</span><span>최저 ~ 최고</span><span></span></div>`;
  let northSep = false;
  for (const g of groups) {
    const list = CITIES.filter(c => g.keys.includes(c.prov) && (!q || c.name.includes(q) || PROV[c.prov].name.includes(q)))
                       .sort((a, b) => g.keys.indexOf(a.prov) - g.keys.indexOf(b.prov) || a.rank - b.rank || a.id - b.id);
    if (!list.length) continue;
    if (g.north && !northSep) { html += `<div class="lsep">이북5도</div>`; northSep = true; }
    const temps = list.map(c => overview[c.id].temp);
    const avg = temps.reduce((s, t) => s + t, 0) / temps.length;
    const rep = overview[list[0].id], w = wmo(rep.code, rep.isDay); // 대표 도시(도청 소재지 등)의 날씨
    const open = openGroups.has(g.id) || !!q; // 검색 중에는 모두 펼침
    html += `<button class="prow${open ? " open" : ""}" data-g="${g.id}">
      <span class="pn">${g.name}</span><span title="${list[0].name} ${w.desc}">${w.icon}</span>
      <span class="pt">${r(avg)}°</span>
      <span class="pr"><span class="lo">${r(Math.min(...temps))}°</span> ~ <span class="hi">${r(Math.max(...temps))}°</span></span>
      <span class="pc">${list.length}곳 <span class="chev">›</span></span></button>`;
    if (open) html += `<div class="pcities">` + list.map(c => {
      const o = overview[c.id], cw = wmo(o.code, o.isDay);
      return `<button class="chip${c.id === selected ? " active" : ""}" data-id="${c.id}" title="${cw.desc} · 최고 ${r(o.max)}° 최저 ${r(o.min)}°">
        ${c.name} <span>${cw.icon}</span><b style="color:${tempColor(o.temp)}">${r(o.temp)}°</b></button>`;
    }).join("") + `</div>`;
  }
  el.innerHTML = html.includes("prow") ? html : `<div class="muted" style="padding:12px 0">검색 결과가 없습니다.</div>`;
  el.querySelectorAll(".prow").forEach(b => b.onclick = () => {
    const id = b.dataset.g;
    openGroups.has(id) ? openGroups.delete(id) : openGroups.add(id);
    renderList();
  });
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => select(+b.dataset.id));
}

// ───────── 지도 ─────────
const svg = document.getElementById("map");
const polys = g => !g ? [] : g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
const MAP_W = 1000, PAD = 20;
let proj, unproj, full, vb, raf = 0, landD = "";
// 지도 단계: topView = 'all'(한반도) | 'south'(남한), level = 시·도 key(2차) | null(1차)
let topView = "all", level = null, animating = false, anim = 0, animTimer = 0;
let heatOn = false, heatDirty = true, grid = null; // grid: HEAT_GRID 점 순서의 기온
try { heatOn = localStorage.getItem("kw_heat") === "1"; } catch {}

(function setupMap() {
  let minX = 180, maxX = -180, minY = 90, maxY = -90;
  const scan = ([x, y]) => { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); };
  GEO.features.forEach(f => polys(f.geometry).forEach(p => p.forEach(r => r.forEach(scan))));
  CITIES.forEach(c => scan([c.lon, c.lat]));
  const k = Math.cos((minY + maxY) / 2 * Math.PI / 180);
  const s = (MAP_W - PAD * 2) / ((maxX - minX) * k);
  proj = (lon, lat) => [PAD + (lon - minX) * k * s, PAD + (maxY - lat) * s];
  unproj = (x, y) => [minX + (x - PAD) / (k * s), maxY - (y - PAD) / s];
  full = { x: 0, y: 0, w: MAP_W, h: (maxY - minY) * s + PAD * 2 };
  vb = { ...full };
  CITIES.forEach(c => [c.x, c.y] = proj(c.lon, c.lat));

  const toPath = rings => rings.map(r => "M" + r.map(c => proj(c[0], c[1]).map(v => v.toFixed(1)).join(",")).join("L") + "Z").join("");
  const ds = GEO.features.map(f => polys(f.geometry).map(toPath).join(""));
  landD = ds.join("");
  document.getElementById("land").innerHTML = GEO.features.map((f, i) => {
    const p = PROV[f.properties.name];
    return `<path class="prov" data-key="${f.properties.name}" d="${ds[i]}"><title>${p ? p.name : ""}</title></path>`;
  }).join("");

  // 남한 보기용: 휴전선, 북쪽 음영(도 경계 없이 육지 전체를 한 덩어리로), 남·북 잘라내기 영역
  const line = pts => "M" + pts.map(([lon, lat]) => proj(lon, lat).map(v => v.toFixed(1)).join(",")).join("L");
  document.getElementById("mdl").setAttribute("d", line(MDL));
  // 음영: 이북5도는 통째로, 경기·강원은 휴전선 이북 부분만(northClip)
  document.getElementById("shadeN").setAttribute("d", ds.filter((_, i) => PROV[GEO.features[i].properties.name].north).join(""));
  document.getElementById("shade").setAttribute("d", ds.filter((_, i) => SPLIT.includes(GEO.features[i].properties.name)).join(""));
  document.getElementById("southClipPath").setAttribute("d", line(SOUTH_POLY) + "Z");
  document.getElementById("northClipPath").setAttribute("d", line(NORTH_POLY) + "Z");
  const [lx, ly] = proj(127.55, 38.36);
  const lbl = document.getElementById("mdlLabel");
  lbl.setAttribute("x", lx); lbl.setAttribute("y", ly); lbl.setAttribute("text-anchor", "middle");
  const heat = document.getElementById("heat");
  heat.setAttribute("x", full.x); heat.setAttribute("y", full.y);
  heat.setAttribute("width", full.w); heat.setAttribute("height", full.h);

  // 범례: 2°C 계단색
  const stops = [];
  for (let t = T_MIN; t < T_MAX; t += BAND) {
    const [a, b] = [(t - T_MIN) / (T_MAX - T_MIN) * 100, (t + BAND - T_MIN) / (T_MAX - T_MIN) * 100];
    const [R, G, B] = heatRgb(t + 0.01);
    stops.push(`rgb(${R},${G},${B}) ${a}% ${b}%`);
  }
  document.querySelectorAll(".legend .scale").forEach(el => el.style.background = `linear-gradient(90deg, ${stops.join(",")})`);
  setViewBox(vb);
})();

// 기온 분포: 도시 위치가 아니라 한반도 전역의 고른 격자(약 35km 간격, HEAT_GRID)에서 기온을 받아

async function loadGrid(force = false) {

      current: "temperature_2m", timezone: "Asia/Seoul",

const cr = t => { const t2 = t * t, t3 = t2 * t;

function buildHeat(view = heatView || vb) {

  HG.pts.forEach(([i, j], n) => { if (grid[n] != null) G[j * nx + i] = grid[n]; });

      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {

        if (ii < 0 || jj < 0 || ii >= nx || jj >= ny) continue;
        const v = G[jj * nx + ii];

  const ppu = Math.min(box.width / view.w, box.height / view.h) || 1;
  const Wc = Math.max(200, Math.min(2000, Math.round(view.w * ppu * dpr)));

  cv.width = Wc; cv.height = Hc;

  // 1) 육지 모양을 먼저 그려 투명도(가장자리 부드럽게)를 얻고, 육지 픽셀만 계산
  ctx.setTransform(Wc / view.w, 0, 0, Hc / view.h, -view.x * Wc / view.w, -view.y * Hc / view.h);

        // 가장자리: 네 꼭짓점 중 값이 있는 것만으로 쌍선형
        let sw = 0, st = 0;

  heat.setAttribute("href", cv.toDataURL());

  heat.setAttribute("width", view.w); heat.setAttribute("height", view.h);
}

function setViewBox(v) { vb = v; svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`); }
// 화면 → viewBox 배율 (preserveAspectRatio meet)
function viewScale() {
  const b = svg.getBoundingClientRect();
  const ppu = Math.min(b.width / vb.w, b.height / vb.h) || 1;
  return { b, ppu, ox: (b.width - vb.w * ppu) / 2, oy: (b.height - vb.h * ppu) / 2 };

    x0 = Math.min(x0, bb.x); y0 = Math.min(y0, bb.y); x1 = Math.max(x1, bb.x + bb.width); y1 = Math.max(y1, bb.y + bb.height);

    x0 = Math.min(x0, c.x); y0 = Math.min(y0, c.y); x1 = Math.max(x1, c.x); y1 = Math.max(y1, c.y);

function southBoundsOf(keys, minW = 0) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  for (const key of keys) {
    const f = GEO.features.find(f => f.properties.name === key);
    const split = SPLIT.includes(key);
    polys(f.geometry).forEach(p => p[0].forEach(([lon, lat]) => { if (!split || inRing([lon, lat], SOUTH_POLY)) add(...proj(lon, lat)); }));
    provCities(key).forEach(c => add(c.x, c.y));
  }
  if (x1 - x0 < minW) { const cx = (x0 + x1) / 2; x0 = cx - minW / 2; x1 = cx + minW / 2; }

function animateTo(target) {

  };

const labelScale = () => matchMedia("(max-width: 760px)").matches ? 0.8 : 1;
function drawMarkers() {
  const g = document.getElementById("marks");
  if (!overview.length || animating) { if (!overview.length) g.innerHTML = ""; return; }
  const { ppu, ox, oy } = viewScale();
  const LS = labelScale();     // 휴대폰에서는 라벨을 작게
  const L = LS / ppu;
  const sx = c => (c.x - vb.x) * ppu + ox, sy = c => (c.y - vb.y) * ppu + oy;
  const { width: W, height: H } = svg.getBoundingClientRect();

  const pool = level ? provCities(level)

  const pts = order.map(c => [sx(c), sy(c)]);

    const o = overview[c.id], w = wmo(o.code, o.isDay);
    return `<g class="mk${c.id === selected ? " active" : ""}" data-id="${c.id}" transform="translate(${c.x.toFixed(1)},${c.y.toFixed(1)}) scale(${L.toFixed(4)})">
      <rect x="${dx - 27}" y="${dy - 11}" width="54" height="22" rx="11" stroke="${tempColor(o.temp)}"/>
      <text x="${dx - 12}" y="${dy + 4.5}" text-anchor="middle" font-size="12">${w.icon}</text>
      <text x="${dx + 11}" y="${dy + 4.5}" text-anchor="middle" font-size="12" font-weight="700">${r(o.temp)}°</text>
      <text class="nm" x="${dx}" y="${dy + 24}" text-anchor="middle">${c.name}</text>
      <title>${c.name} (${PROV[c.prov].name}) · ${w.desc} ${r(o.temp)}° · 최고 ${r(o.max)}° 최저 ${r(o.min)}°</title></g>`;
  }).join("");
  g.innerHTML = labelSvg;
}

// ───────── 세계 (지구본, 나라별 수도 날씨) ─────────
// 국가 경계·수도: Natural Earth(공개 자료), 지구본 투영: d3 — 세계 탭을 처음 열 때만 불러옴
const D3_URL = "https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js";
const NE_URL = "https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@v5.1.2/geojson/";
const WORLD_TTL = 60 * 60 * 1000;
// countries: 나라(경계·이름), cities: 날씨 지점(도시), data: cities 순서의 날씨, ctemp: 나라별 평균 기온
const W = { ready: null, countries: [], cities: [], data: null, ctemp: [], time: 0, sel: null,
            rot: [-127.5, -30, 0], spin: true, dragging: false, raf: 0, zoom: 1 };
const ZOOM_MIN = 1, ZOOM_MAX = 12;
const prop = (p, k) => p[k] ?? p[k.toUpperCase()] ?? p[k.toLowerCase()];
// 지도에 쓸 나라 이름 (자료의 공식 명칭 대신 흔히 쓰는 이름)
const NAME_FIX = { ATA: "남극", CHN: "중국", TWN: "대만" };
// 국명은 붙여 씀 (콩고 민주 공화국 → 콩고민주공화국)
const countryName = (a3, raw) => (NAME_FIX[a3] || raw).replace(/\s+/g, "");
// 도시 이름: 행정 접미사(직할시·특별시 등)를 떼고 흔히 쓰는 이름으로
const CITY_FIX = { "도쿄도": "도쿄", "베이징시": "베이징", "상하이시": "상하이", "타이베이시": "타이베이", "교토시": "교토",
                   "우루무치시": "우루무치", "청두시": "청두", "쿠웨이트 시": "쿠웨이트시티", "브뤼셀 시": "브뤼셀",
                   "바티칸 시국": "바티칸", "과테말라 시티": "과테말라시티" };
const cityName = raw => CITY_FIX[raw] || raw.replace(/(특별시|직할시|광역시|특별자치시)$/, "");
// 국기 이미지 (flag-icons, ISO 2글자 코드)
const FLAG_URL = cc => `https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/flags/4x3/${cc}.svg`;
const loadScript = src => new Promise((ok, no) => {
  const s = document.createElement("script");
  s.src = src; s.onload = ok; s.onerror = () => no(new Error("지구본 라이브러리를 불러오지 못했습니다"));
  document.head.appendChild(s);
});
const gsvg = document.getElementById("globe");
let gProj, gPath;

function initWorld() {
  if (W.ready) return W.ready;
  W.ready = (async () => {
    if (!window.d3) await loadScript(D3_URL);
    const [cj, pj] = await Promise.all(["ne_110m_admin_0_countries.geojson", "ne_110m_populated_places.geojson"]
      .map(f => fetch(NE_URL + f).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })));
    // 나라: 북한(PRK)은 대한민국(KOR)에 합침 (공유 경계를 지워 한 덩어리로)
    const feats = cj.features;
    const kor = feats.find(f => prop(f.properties, "ADM0_A3") === "KOR");
    const prk = feats.find(f => prop(f.properties, "ADM0_A3") === "PRK");
    if (kor && prk) kor.geometry = mergeGeoms(kor.geometry, prk.geometry);
    // 크림반도: 기본 자료에는 러시아로 되어 있어 우크라이나로 옮김
    const rus = feats.find(f => prop(f.properties, "ADM0_A3") === "RUS");
    const ukr = feats.find(f => prop(f.properties, "ADM0_A3") === "UKR");
    if (rus && ukr) {
      const rp = polys(rus.geometry);
      const ci = rp.findIndex(p => d3.geoContains({ type: "Polygon", coordinates: p }, [34.1, 45.0]));
      if (ci >= 0 && d3.geoArea({ type: "Polygon", coordinates: rp[ci] }) < 0.001) {
        ukr.geometry = mergeGeoms(ukr.geometry, { type: "Polygon", coordinates: rp[ci] });
        rus.geometry = { type: "MultiPolygon", coordinates: rp.filter((_, i) => i !== ci) };
      }
    }
    W.countries = feats.filter(f => f !== prk).map((f, i) => {
      const p = f.properties, a3 = prop(p, "ADM0_A3");
      const lx = +prop(p, "LABEL_X"), ly = +prop(p, "LABEL_Y");
      const iso2 = String(prop(p, "ISO_A2_EH") || prop(p, "ISO_A2") || "");
      return { i, f, a3, area: d3.geoArea(f), cities: [],
               iso2: /^[A-Z]{2}$/.test(iso2) ? iso2.toLowerCase() : null,
               name: countryName(a3, prop(p, "NAME_KO") || prop(p, "NAME")),
               label: Number.isFinite(lx) && Number.isFinite(ly) && a3 !== "ATA" ? [lx, ly] : d3.geoCentroid(f) };
    });
    const byA3 = Object.fromEntries(W.countries.map(c => [c.a3, c]));
    const findCountry = (a3, lon, lat) => byA3[a3 === "PRK" ? "KOR" : a3] || W.countries.find(c => d3.geoContains(c.f, [lon, lat]));

    // 도시: Natural Earth 주요 도시(수도 포함) + 보강 목록(world_cities.js), 0.5° 안쪽 중복 제거
    const cities = [];
    const add = (name, lon, lat, a3, cap, pop) => {
      if (cities.some(c => Math.abs(c.lon - lon) < 0.5 && Math.abs(c.lat - lat) < 0.5)) return;
      const country = findCountry(a3, lon, lat);
      if (!country) return;
      cities.push({ name, lon, lat, country, cap, pop });
    };
    pj.features
      .sort((a, b) => (+prop(b.properties, "ADM0CAP") || 0) - (+prop(a.properties, "ADM0CAP") || 0))
      .forEach(f => {
        const p = f.properties, [lon, lat] = f.geometry.coordinates;
        const a3 = prop(p, "ADM0_A3");
        add(cityName(prop(p, "NAME_KO") || prop(p, "NAME")), lon, lat, a3, +prop(p, "ADM0CAP") === 1 && a3 !== "PRK", +prop(p, "POP_MAX") || 0);
      });
    (window.WORLD_EXTRA || []).forEach(([name, lat, lon, a3]) => add(name, lon, lat, a3, false, 0));
    // 도시가 하나도 없는 나라는 영토 중앙에 지점 하나
    W.countries.forEach(c => { if (!cities.some(x => x.country === c)) cities.push({ name: c.name, lon: c.label[0], lat: c.label[1], country: c, cap: false, pop: 0 }); });
    cities.forEach((c, i) => { c.i = i; c.country.cities.push(c); });
    W.cities = cities;
    buildGlobe();
    await loadWorldWeather();
  })();
  W.ready.catch(() => { W.ready = null; });
  return W.ready;
}

// 두 나라 경계를 하나로: 가장 많이 맞닿은 외곽 링끼리 공유 변을 지우고 다시 이음 (실패하면 단순 합침)
function mergeGeoms(a, b) {
  const pa = polys(a).map(p => p.map(r => r.slice())), pb = polys(b);
  const key = c => c[0] + "," + c[1];
  let best = null, bestN = 1;
  pa.forEach((p, i) => pb.forEach((q, j) => {
    const s = new Set(p[0].map(key));
    const n = q[0].filter(c => s.has(key(c))).length;
    if (n > bestN) { bestN = n; best = [i, j]; }
  }));
  if (!best) return { type: "MultiPolygon", coordinates: [...pa, ...pb] };
  const area = ring => ring.reduce((s, [x1, y1], i) => { const [x2, y2] = ring[(i + 1) % ring.length]; return s + x1 * y2 - x2 * y1; }, 0);
  const open = r => key(r[0]) === key(r[r.length - 1]) ? r.slice(0, -1) : r.slice();
  let A = open(pa[best[0]][0]), B = open(pb[best[1]][0]);
  if (Math.sign(area(A)) !== Math.sign(area(B))) B.reverse();
  const edges = [];
  for (const R of [A, B]) R.forEach((p, i) => edges.push([p, R[(i + 1) % R.length]]));
  const und = e => [key(e[0]), key(e[1])].sort().join("|");
  const cnt = new Map();
  edges.forEach(e => cnt.set(und(e), (cnt.get(und(e)) || 0) + 1));
  const next = new Map(edges.filter(e => cnt.get(und(e)) === 1).map(e => [key(e[0]), e]));
  const rings = [];
  while (next.size) {
    const [sk, first] = next.entries().next().value;
    const ring = [first[0]];
    let e = first; next.delete(sk);
    while (key(e[1]) !== sk) {
      ring.push(e[1]);
      e = next.get(key(e[1]));
      if (!e) return { type: "MultiPolygon", coordinates: [...pa, ...pb] };
      next.delete(key(e[0]));
    }
    ring.push(ring[0]);
    rings.push(ring);
  }
  rings.sort((p, q) => Math.abs(area(q)) - Math.abs(area(p)));
  const merged = [rings[0], ...rings.slice(1)];
  const rest = [...pa.filter((_, i) => i !== best[0]), ...pb.filter((_, j) => j !== best[1])];
  return { type: "MultiPolygon", coordinates: [merged, ...rest] };
}

async function loadWorldWeather(force = false) {
  const key = W.cities.map(c => c.name).join();
  const cached = cacheGet("kw_world_v2");
  if (!force && cached && cached.key === key && Date.now() - cached.t < WORLD_TTL) {
    W.data = cached.data; W.time = cached.t;
  } else {
    const chunks = [];
    for (let i = 0; i < W.cities.length; i += CHUNK) chunks.push(W.cities.slice(i, i + CHUNK));
    const res = await Promise.all(chunks.map(async list => {
      const params = new URLSearchParams({
        latitude: list.map(c => c.lat.toFixed(3)).join(","), longitude: list.map(c => c.lon.toFixed(3)).join(","),
        current: "temperature_2m,weather_code,is_day", daily: "temperature_2m_max,temperature_2m_min",
        timezone: "auto", forecast_days: "1",
      });
      const j = await apiGet(params, list.length);
      return Array.isArray(j) ? j : [j];
    }));
    W.data = res.flat().map(d => ({ temp: d.current.temperature_2m, code: d.current.weather_code, isDay: d.current.is_day,
                                    max: d.daily.temperature_2m_max[0], min: d.daily.temperature_2m_min[0] }));
    W.time = Date.now();
    cacheSet("kw_world_v2", { t: W.time, key, data: W.data });
  }
  // 나라 색 = 그 나라 도시들의 평균 기온
  W.ctemp = W.countries.map(c => c.cities.reduce((s, x) => s + W.data[x.i].temp, 0) / c.cities.length);
  renderGlobe();
  renderExtremes();
}

function buildGlobe() {
  gProj = d3.geoOrthographic().clipAngle(90).precision(0.5);
  gPath = d3.geoPath(gProj);
  const s = d3.select(gsvg);
  s.selectAll("*").remove();
  s.append("path").attr("class", "sphere").datum({ type: "Sphere" });
  s.append("path").attr("class", "grat").datum(d3.geoGraticule10());
  s.append("g").selectAll("path").data(W.countries).join("path")
    .attr("class", "country")
    .on("click", (e, c) => selectCountry(c))
    .append("title");
  s.append("g").attr("id", "cnames");
  s.append("g").attr("id", "wmarks");
  // 한 손가락/마우스: 회전, 두 손가락: 확대·축소(핀치)
  const touches = new Map();
  let pinch = null;
  const spread = () => { const [a, b] = [...touches.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]) || 1; };
  s.call(d3.drag()
    .on("start", e => {
      W.dragging = true; gsvg.classList.add("dragging");
      if (e.identifier !== "mouse") touches.set(e.identifier, [e.x, e.y]);
      if (touches.size === 2) pinch = { d: spread(), z: W.zoom };
    })
    .on("drag", e => {
      if (touches.has(e.identifier)) touches.set(e.identifier, [e.x, e.y]);
      if (W.spin) setSpin(false);
      if (touches.size >= 2 && pinch) return setZoom(pinch.z * spread() / pinch.d);
      const k = 70 / gProj.scale();
      W.rot[0] += e.dx * k; W.rot[1] = Math.max(-85, Math.min(85, W.rot[1] - e.dy * k));
      renderGlobe();
    })
    .on("end", e => {
      touches.delete(e.identifier);
      if (touches.size < 2) pinch = null;
      if (!touches.size) { W.dragging = false; gsvg.classList.remove("dragging"); }
    }));
  gsvg.addEventListener("wheel", e => { e.preventDefault(); setZoom(W.zoom * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  d3.select(gsvg).on("click", e => { const m = e.target.closest("[data-w]"); if (m) selectWorld(W.cities[+m.dataset.w], true); });
  sizeGlobe();
}
function sizeGlobe() {
  if (!gProj) return;
  const b = gsvg.getBoundingClientRect();
  if (!b.width) return;
  gsvg.setAttribute("width", b.width); gsvg.setAttribute("height", b.height);
  // 휴대폰(세로 화면)은 지구본을 크게 — 양옆이 조금 잘려도 세로 공간을 채움
  const base = labelScale() < 1 ? Math.min(b.width * 0.68, b.height / 2 - 12) : Math.min(b.width, b.height) / 2 - 18;
  gProj.scale(base * W.zoom).translate([b.width / 2, b.height / 2]);
}
function setZoom(z) {
  W.zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
  sizeGlobe(); renderGlobe();
}
document.getElementById("gzin").onclick = () => setZoom(W.zoom * 1.5);
document.getElementById("gzout").onclick = () => setZoom(W.zoom / 1.5);
document.getElementById("gzreset").onclick = () => setZoom(1);
const worldColor = t => { const [R, G, B] = heatRgb(t); return `rgb(${R},${G},${B})`; };
function renderGlobe() {
  if (!gProj) return;
  gProj.rotate(W.rot);
  const s = d3.select(gsvg);
  s.select(".sphere").attr("d", gPath);
  s.select(".grat").attr("d", gPath);
  const selCountry = W.sel && W.sel.country;
  s.selectAll(".country")
    .attr("d", c => gPath(c.f))
    .attr("fill", c => W.data ? worldColor(W.ctemp[c.i]) : "var(--land)")
    .classed("sel", c => c === selCountry)
    .select("title").text(c => W.data ? `${c.name} · 도시 ${c.cities.length}곳 평균 ${r(W.ctemp[c.i])}°` : c.name);
  drawCountryNames();
  drawWorldMarkers();
}
// 나라 이름: 지구본 표면에 붙여 그림 — 이름 위치에서 지구 표면의 동·북 방향이 화면에 투영된 모양(야코비안)을
// 글자의 변형 행렬로 써서, 가장자리로 갈수록 눌리고 기울어지게 함
function drawCountryNames() {
  const g = document.getElementById("cnames");
  if (!g) return;
  const center = [-W.rot[0], -W.rot[1]];
  const R = gProj.scale(), k = R * Math.PI / 180;
  const b = gsvg.getBoundingClientRect();
  let html = "";
  for (const c of W.countries) {
    const dist = d3.geoDistance(c.label, center);
    if (dist > 1.4) continue;
    // 영토 한 변의 대략 길이(정면 기준 px)로 글자 크기, 이름이 영토 폭을 넘지 않게
    const size = Math.sqrt(c.area) * R;
    const fs = Math.min(size / 4.2, size * 1.25 / (c.name.length * 0.95), 48);
    if (fs < 7) continue;
    const [lon, lat] = c.label;
    const p0 = gProj(c.label);
    if (!p0 || p0[0] < -200 || p0[1] < -200 || p0[0] > b.width + 200 || p0[1] > b.height + 200) continue;
    const d = 0.5, cl = Math.max(0.15, Math.cos(lat * Math.PI / 180));
    const pe = gProj([lon + d / cl, lat]), pn = gProj([lon, Math.min(89.9, lat + d)]);
    if (!pe || !pn) continue;
    const ex = (pe[0] - p0[0]) / (k * d), ey = (pe[1] - p0[1]) / (k * d);
    const nx = (pn[0] - p0[0]) / (k * d), ny = (pn[1] - p0[1]) / (k * d);
    const op = (0.4 * Math.min(1, Math.cos(dist) * 1.6)).toFixed(2); // 가장자리는 옅게
    html += `<text class="cname" font-size="${fs.toFixed(1)}" fill-opacity="${op}"
      transform="matrix(${ex.toFixed(4)} ${ey.toFixed(4)} ${(-nx).toFixed(4)} ${(-ny).toFixed(4)} ${p0[0].toFixed(1)} ${p0[1].toFixed(1)})">${c.name}</text>`;
  }
  g.innerHTML = html;
}
// 보이는 반구의 도시만, 수도·큰 도시부터 겹치지 않게 라벨 (지시선 없음)
function drawWorldMarkers() {
  const g = document.getElementById("wmarks");
  if (!W.data || !g) return;
  const b = gsvg.getBoundingClientRect();
  const center = [-W.rot[0], -W.rot[1]];
  const boxes = [];
  document.querySelectorAll("#worldView .ovl").forEach(el => {
    const a = el.getBoundingClientRect();
    boxes.push([a.left - b.left - 4, a.top - b.top - 4, a.right - b.left + 4, a.bottom - b.top + 4]);
  });
  // 우선순위: 선택 → 넓은 나라의 수도 → 수도 → 인구
  const score = c => (c === W.sel ? 1e12 : 0) + (c.cap ? 1e9 + c.country.area * 1e8 : 0) + c.pop;
  const order = [...W.cities].sort((a, c) => score(c) - score(a));
  const LS = labelScale();
  let html = "";
  for (const c of order) {
    if (d3.geoDistance([c.lon, c.lat], center) > 1.35) continue; // 가장자리는 생략
    const [x, y] = gProj([c.lon, c.lat]);
    if (x < -30 || y < -30 || x > b.width + 30 || y > b.height + 30) continue; // 확대해서 화면 밖
    const box = [x - 28 * LS, y - 12 * LS, x + 28 * LS, y + 27 * LS];
    if (boxes.some(o => box[0] < o[2] && box[2] > o[0] && box[1] < o[3] && box[3] > o[1])) continue;
    boxes.push(box);
    const o = W.data[c.i], w = wmo(o.code, o.isDay);
    html += `<g class="mk${c === W.sel ? " active" : ""}" data-w="${c.i}" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${LS})">
      <rect x="-27" y="-11" width="54" height="22" rx="11" stroke="${tempColor(o.temp)}"/>
      <text x="-12" y="4.5" text-anchor="middle" font-size="12">${w.icon}</text>
      <text x="11" y="4.5" text-anchor="middle" font-size="12" font-weight="700">${r(o.temp)}°</text>
      <text class="nm" y="24" text-anchor="middle">${c.name}</text>
      <title>${c.name} (${c.country.name}${c.cap ? " 수도" : ""}) · ${w.desc} ${r(o.temp)}° · 최고 ${r(o.max)}° 최저 ${r(o.min)}°</title></g>`;
  }
  g.innerHTML = html;
}
function setSpin(on) {
  W.spin = on;
  document.getElementById("spinBtn").classList.toggle("on", on);
  cancelAnimationFrame(W.raf);
  if (!on || tab !== "world") return;
  let last = performance.now();
  const step = now => {
    if (!W.spin || tab !== "world") return;
    if (!W.dragging && now - last > 33) { W.rot[0] += (now - last) * 0.004; last = now; renderGlobe(); }
    W.raf = requestAnimationFrame(step);
  };
  W.raf = requestAnimationFrame(step);
}
document.getElementById("spinBtn").onclick = () => setSpin(!W.spin);
function rotateTo(lon, lat) {
  const from = [...W.rot], to = [-lon, Math.max(-60, Math.min(60, -lat)), 0];
  while (to[0] - from[0] > 180) to[0] -= 360;
  while (from[0] - to[0] > 180) to[0] += 360;
  const t0 = performance.now(), D = 700;
  const step = () => {
    const t = Math.min(1, (performance.now() - t0) / D), e = 1 - Math.pow(1 - t, 3);
    W.rot = [from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e, 0];
    renderGlobe();
    if (t < 1) setTimeout(step, 16); // 탭이 백그라운드여도 끝까지 진행
  };
  step();
}
// 도시 선택 → 지구본을 그 도시로 돌리고 상세 예보(현지 시각)
function selectWorld(c, rotate = false) {
  W.sel = c;
  if (rotate) { setSpin(false); rotateTo(c.lon, c.lat); } else renderGlobe();
  showDetail({ key: "w" + c.i + c.name, name: c.name, sub: `${c.country.name}${c.cap ? " · 수도" : ""} · 현지 시각`,
               lat: c.lat, lon: c.lon, tz: "auto", flag: c.country.iso2, country: c.country.name,
               quick: W.data && W.data[c.i] });
}
// 나라를 누르면 그 나라의 수도(없으면 첫 도시)
function selectCountry(country) {
  selectWorld(country.cities.find(c => c.cap) || country.cities[0], true);
}
function renderWorldExtremes(el) {
  if (!W.data) { el.innerHTML = ""; return; }
  let hi = W.cities[0], lo = W.cities[0];
  for (const c of W.cities) {
    if (W.data[c.i].temp > W.data[hi.i].temp) hi = c;
    if (W.data[c.i].temp < W.data[lo.i].temp) lo = c;
  }
  const chip = (c, label, cls) => `<button data-w="${c.i}" title="${c.country.name} ${c.name}">
    <span class="k">세계 ${label}</span><span>${c.name}</span><b class="${cls}">${r(W.data[c.i].temp)}°</b></button>`;
  el.innerHTML = chip(hi, "최고", "hi") + chip(lo, "최저", "lo");
  el.querySelectorAll("button").forEach(b => b.onclick = () => selectWorld(W.cities[+b.dataset.w], true));
}
async function openWorld() {
  const msg = document.getElementById("worldMsg");
  if (!W.data) { msg.hidden = false; msg.textContent = "지구본을 불러오는 중…"; }
  try {
    await initWorld();
    msg.hidden = true;
    sizeGlobe(); renderGlobe(); renderExtremes();
    const t = W.time ? new Date(W.time).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : "";
    if (t) document.getElementById("updated").textContent = "업데이트 " + t;
    setSpin(W.spin);
  } catch (e) {
    msg.hidden = false;
    msg.textContent = "세계 날씨를 불러오지 못했습니다: " + (/429/.test(e.message) ? "요청 한도 초과, 1분 뒤 다시 시도하세요" : e.message);
  }
}
new ResizeObserver(() => { if (tab === "world") { sizeGlobe(); renderGlobe(); } }).observe(gsvg);

// ───────── 탭 · 검색 ─────────
// 탭: 한국(지도·목록) / 세계. tab 값은 "map" | "list" | "world"
let tab = "map", koreaSub = "map";
function setTab(name) {
  if (name === "world" && tab !== "world") pushLayer("world");
  tab = name;
  if (name !== "world") koreaSub = name;
  document.getElementById("tabKorea").classList.toggle("on", name !== "world");
  document.getElementById("tabWorld").classList.toggle("on", name === "world");
  document.getElementById("subTabs").hidden = name === "world";
  document.getElementById("tabMap").classList.toggle("on", name === "map");
  document.getElementById("tabList").classList.toggle("on", name === "list");
  document.getElementById("mapView").hidden = name !== "map";
  document.getElementById("listView").hidden = name !== "list";
  document.getElementById("worldView").hidden = name !== "world";
  $search.placeholder = name === "world" ? "나라·도시 검색 후 Enter" : "도시 검색 후 Enter";
  if (name === "map") drawMarkers();
  if (name === "list") renderList();
  if (name === "world") {
    openWorld();
    if (W.sel) selectWorld(W.sel);
  } else {
    cancelAnimationFrame(W.raf);
    if (detailKey && detailKey.startsWith("w")) select(selected);
    if (overviewTime) document.getElementById("updated").textContent =
      "업데이트 " + new Date(overviewTime).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  }
  renderExtremes();
}
document.getElementById("tabKorea").onclick = () => { if (tab === "world") popLayer("world", () => setTab(koreaSub)); };
document.getElementById("tabMap").onclick = () => setTab("map");
document.getElementById("tabList").onclick = () => setTab("list");
document.getElementById("tabWorld").onclick = () => setTab("world");

const $search = document.getElementById("search");
$search.addEventListener("input", () => { $search.classList.remove("miss"); renderList(); });
$search.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const v = $search.value.trim();
  if (!v) return;
  if (tab === "world") {
    // 도시 이름 → 나라 이름(그 나라 수도) 순서로 찾음
    const city = W.cities.find(c => c.name === v) || W.cities.find(c => c.name.startsWith(v));
    const country = W.countries.find(c => c.name === v) || W.countries.find(c => c.name.startsWith(v)) || W.countries.find(c => c.name.includes(v));
    if (!city && !country) { $search.classList.add("miss"); return; }
    $search.value = "";
    return city ? selectWorld(city, true) : selectCountry(country);
  }
  const hit = CITIES.find(c => c.name === v) || CITIES.find(c => c.name.startsWith(v)) || CITIES.find(c => c.name.includes(v));
  if (!hit) { $search.classList.add("miss"); return; }
  $search.value = "";
  select(hit.id, { focus: true });
});

document.getElementById("refresh").onclick = async () => {
  detailCache.clear();
  if (tab === "world" && W.countries.length) {
    try { await loadWorldWeather(true); } catch {}
    if (W.sel) selectWorld(W.sel);
    return;
  }
  loadOverview(true); select(selected);
  if (heatOn) { try { await loadGrid(true); buildHeat(); } catch {} }
};

// ───────── 휴대폰: 바텀시트 · 뒤로가기 · 앱 설치 ─────────
const sheet = document.getElementById("sheet");
// 머리 실제 높이를 CSS 변수로 → 휴대폰에서 지도가 남은 화면을 꽉 채움
const topBar = document.getElementById("top");
new ResizeObserver(() => document.documentElement.style.setProperty("--headH", topBar.offsetHeight + "px")).observe(topBar);
// 휴대폰: 🔍 버튼으로 검색창 펼치기/접기
document.getElementById("searchBtn").onclick = () => {
  const on = topBar.classList.toggle("searching");
  if (on) $search.focus(); else $search.blur();
};
$search.addEventListener("keydown", e => {
  if (e.key === "Enter" && !$search.classList.contains("miss")) setTimeout(() => topBar.classList.remove("searching"), 0);
});
const isPhone = () => matchMedia("(max-width: 760px)").matches;
// 화면 '층'(도 화면, 세계 탭, 펼친 시트)마다 기록을 하나씩 쌓아, 안드로이드 뒤로가기가 앱을 닫지 않고 한 층씩 닫게 함
function pushLayer(kind) { history.pushState({ nav: kind }, ""); }
function popLayer(kind, close) {
  if (history.state && history.state.nav === kind) history.back(); // popstate에서 닫힘
  else close();
}
window.addEventListener("popstate", () => {
  if (sheet.classList.contains("open")) return setSheet(false, true);
  if (tab === "world") return setTab(koreaSub);
  if (level) return setLevel(null);
});
function setSheet(open, fromPop = false) {
  if (!isPhone()) return;
  if (open === sheet.classList.contains("open")) return;
  if (open) { pushLayer("sheet"); sheet.classList.add("open"); sheet.scrollTop = 0; }
  else if (!fromPop && history.state && history.state.nav === "sheet") history.back();
  else sheet.classList.remove("open");
}
// 손잡이·제목을 누르면 펼치기/접기, 위로 쓸면 펼치고 아래로 쓸면(맨 위에서) 접기
sheet.addEventListener("click", e => {
  if (e.target.closest(".grab, h2, .prov-name, .now, .flag")) setSheet(!sheet.classList.contains("open"));
});
let touchY = null;
sheet.addEventListener("touchstart", e => { touchY = e.touches[0].clientY; }, { passive: true });
sheet.addEventListener("touchend", e => {
  if (touchY == null) return;
  const dy = e.changedTouches[0].clientY - touchY;
  touchY = null;
  if (dy < -40 && !sheet.classList.contains("open")) setSheet(true);
  else if (dy > 50 && sheet.classList.contains("open") && sheet.scrollTop <= 0) setSheet(false);
});
// 홈 화면 설치 버튼 (크롬이 설치 가능하다고 알려 줄 때만 보임)
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); installEvt = e;
  document.getElementById("installBtn").classList.add("show");
});
document.getElementById("installBtn").onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice;
  installEvt = null;
  document.getElementById("installBtn").classList.remove("show");
};
window.addEventListener("appinstalled", () => document.getElementById("installBtn").classList.remove("show"));
// 서비스 워커(오프라인·설치용): https 또는 localhost 에서만 동작
if ("serviceWorker" in navigator && (location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname))) {
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("서비스 워커 등록 실패:", e));
}

setHeat(heatOn);
updateView();
loadOverview();
select(selected);
// 1시간마다 갱신 (자료도 1시간 단위). 탭이 보이지 않을 때는 API 사용량을 아끼려고 건너뜀
setInterval(async () => {
  if (document.visibilityState !== "visible") return;
  loadOverview(true);
  if (heatOn) { try { await loadGrid(true); buildHeat(); } catch {} }
  if (tab === "world" && W.countries.length) { try { await loadWorldWeather(true); } catch {} }
}, 60 * 60 * 1000);
</script>
</body>
